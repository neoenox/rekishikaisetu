name: YouTube API dependency smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  import-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional API dependencies
        run: python -m pip install -r requirements-youtube.txt
      - name: Check imports and syntax without credentials
        run: |
          python -c "import google.auth; import google_auth_oauthlib.flow; import googleapiclient.discovery; import googleapiclient.http"
          python -m py_compile scripts/yt_api.py
